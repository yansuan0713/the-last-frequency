<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Frequency</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #221c14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="The Last Frequency: tune the dial with the mouse or W and S keys, hold signals inside the bracket to decode them, and keep clear of the red static"></canvas>
<p id="status" role="status" aria-live="polite">The Last Frequency. Press Enter to tune in.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
